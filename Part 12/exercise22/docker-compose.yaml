services:
  bloglist-backend:
    image: bloglist-backend
    build:
      context: ./backend
    env_file:
      - ./backend/.env

  bloglist-frontend:
    image: bloglist-frontend
    build:
      context: ./frontend
    depends_on:
      - bloglist-backend

  nginx:
    image: nginx:1.29.3
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    depends_on:
      - bloglist-frontend
      - bloglist-backend
