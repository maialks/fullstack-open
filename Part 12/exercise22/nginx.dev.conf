events {}

http {
  server {
    listen 80;

    # front
    location / {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_pass http://bloglist-frontend:5173;
    }

    # back
    location /api/ {
      proxy_pass http://bloglist-backend:3000;
    }
  }
}
